name: Release

# A pushed tag builds the plugin and publishes a release with the files Obsidian needs.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: zip notes-events.zip main.js manifest.json styles.css
      - run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css notes-events.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
